openapi: "3.1.0"
info:
  version: 1.0.0
  title: Abstract Protocol

paths:
  /messages:
    get:
      operationId: getMessages
      responses:
        "200":
          description: "A list of messages"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/message"

components:
  schemas:
    abstract_message:
      type: object
      required:
        - body
        - timestamp
      properties:
        body:
          type: string
        timestamp:
          type: string
        tags:
          type: array
          items:
            type: string

    bot_message:
      allOf:
        - $ref: "#/components/schemas/abstract_message"
        - type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum: ["bot"]
            id:
              type: integer
            intent:
              type: string

    user_message:
      allOf:
        - $ref: "#/components/schemas/abstract_message"
        - type: object
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum: ["user"]
            id:
              type: integer
            user_name:
              type: string

    system_message:
      allOf:
        - $ref: "#/components/schemas/abstract_message"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum: ["system"]
            level:
              type: string
              enum: ["info", "warning", "error"]

    message:
      oneOf:
        - $ref: "#/components/schemas/bot_message"
        - $ref: "#/components/schemas/user_message"
        - $ref: "#/components/schemas/system_message"
      discriminator:
        propertyName: type
        mapping:
          bot: "#/components/schemas/bot_message"
          user: "#/components/schemas/user_message"
          system: "#/components/schemas/system_message"

    ui_message:
      oneOf:
        - $ref: "#/components/schemas/bot_message"
        - $ref: "#/components/schemas/user_message"
        - $ref: "#/components/schemas/system_message"
      discriminator:
        propertyName: type
        mapping:
          bot: "#/components/schemas/bot_message"
          user: "#/components/schemas/user_message"
          system: "#/components/schemas/system_message"

    priority_message:
      oneOf:
        - $ref: "#/components/schemas/bot_message"
        - $ref: "#/components/schemas/system_message"
      discriminator:
        propertyName: type
        mapping:
          bot: "#/components/schemas/bot_message"
          system: "#/components/schemas/system_message"

    base_transit_point:
      type: object
      required:
        - name
        - latitude
        - longitude
      properties:
        name:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    airport_transit_point:
      allOf:
        - $ref: "#/components/schemas/base_transit_point"
        - type: object
          required:
            - type
            - code
          properties:
            type:
              type: string
              enum:
                - airport
            code:
              type: string

    geo_transit_point:
      allOf:
        - $ref: "#/components/schemas/base_transit_point"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - geo
            category:
              type: string

    get_message_response:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/message"

    transit_point:
      oneOf:
        - $ref: "#/components/schemas/airport_transit_point"
        - $ref: "#/components/schemas/geo_transit_point"
      discriminator:
        propertyName: type
        mapping:
          airport: "#/components/schemas/airport_transit_point"
          geo: "#/components/schemas/geo_transit_point"
